<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Turing A/B — Respondedor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@400;500&family=Shippori+Mincho:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/static/theme.css" />
</head>
<body class="turing-app turing-human">
  <header class="site-header">
    <div class="site-header__inner">
      <div class="site-header__titles">
        <h1>Respondedor</h1>
        <span class="badge" id="status">Pega el enlace o el token y entra. Una sola respuesta por pregunta; se contesta la más antigua pendiente.</span>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema" title="Tema">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
        </svg>
      </button>
    </div>
  </header>
  <div class="site-wrap">
  <main class="site-main">
    <div class="row" id="joinRow">
      <div class="field">
        <label for="apiBase">API base (vacío = mismo origen)</label>
        <input type="text" id="apiBase" placeholder="https://tu-ip:8000" />
      </div>
      <div class="field" style="flex:2">
        <label for="joinToken">Token del enlace (join)</label>
        <input type="text" id="joinToken" placeholder="token…" autocomplete="off" />
      </div>
      <button type="button" id="btnJoin">Entrar</button>
    </div>
    <p id="err" class="err" hidden></p>

    <div id="chatPanel" hidden>
      <div class="msgs" id="msgs"></div>
      <label for="reply">Tu respuesta</label>
      <textarea id="reply" placeholder="Escribe y envía…"></textarea>
      <div class="row" style="margin-top:0.5rem">
        <button type="button" id="btnSend">Enviar respuesta</button>
      </div>
    </div>
  </main>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const apiBase = () => ($('apiBase').value || '').replace(/\/$/, '');

    let sessionId = null;
    let channel = null;
    let responderToken = null;
    let lastId = 0;
    let pollTimer = null;

    const params = new URLSearchParams(window.location.search);
    const tokenFromUrl = params.get('token');
    if (tokenFromUrl) $('joinToken').value = tokenFromUrl;

    function showErr(msg) {
      const el = $('err');
      if (!msg) { el.hidden = true; el.textContent = ''; return; }
      el.textContent = msg;
      el.hidden = false;
    }

    async function api(path, opts = {}) {
      const url = (apiBase() || '') + path;
      const r = await fetch(url, {
        ...opts,
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
      });
      const text = await r.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch (_) {}
      if (!r.ok) {
        const d = (data && data.detail) ? (Array.isArray(data.detail) ? data.detail.map(x => x.msg).join('; ') : data.detail) : text;
        throw new Error(d || r.statusText);
      }
      return data;
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function appendMessage(m) {
      const box = $('msgs');
      const role = m.role === 'guesser' ? 'Adivinador' : 'Tú';
      const cls = m.role === 'guesser' ? 'guesser' : 'responder';
      const div = document.createElement('div');
      div.className = 'bubble ' + cls;
      div.innerHTML = '<div class="meta">' + role + '</div>' + esc(m.content);
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    async function poll() {
      if (!sessionId || !channel) return;
      const q = `/messages?session_id=${encodeURIComponent(sessionId)}&channel=${channel}&since_id=${lastId}`;
      try {
        const list = await api(q);
        for (const m of list) {
          appendMessage(m);
          lastId = m.id;
        }
      } catch (e) {
        showErr(String(e.message || e));
      }
    }

    function startPoll() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(poll, 1500);
      poll();
    }

    $('btnJoin').onclick = async () => {
      showErr('');
      const tok = $('joinToken').value.trim();
      if (!tok) { showErr('Falta el token'); return; }
      try {
        const data = await api('/human/join', {
          method: 'POST',
          body: JSON.stringify({ token: tok }),
        });
        sessionId = data.session_id;
        channel = data.channel;
        responderToken = data.responder_token;
        lastId = 0;
        $('msgs').innerHTML = '';
        $('status').textContent = 'Canal ' + channel + ' · session ' + sessionId.slice(0, 8) + '…';
        $('joinRow').hidden = true;
        $('chatPanel').hidden = false;
        startPoll();
      } catch (e) {
        showErr(String(e.message || e));
      }
    };

    $('btnSend').onclick = async () => {
      const text = $('reply').value.trim();
      if (!responderToken || !text) return;
      showErr('');
      try {
        await api('/human/reply', {
          method: 'POST',
          body: JSON.stringify({ responder_token: responderToken, content: text }),
        });
        $('reply').value = '';
        await poll();
      } catch (e) {
        showErr(String(e.message || e));
      }
    };
  </script>
  <script src="/static/assets/js/theme-switcher.js"></script>
</body>
</html>
